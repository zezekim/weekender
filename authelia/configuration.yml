# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json
#
# Secrets are NOT in this file. They are read from /config/secrets/* (generated
# by scripts/setup.sh) via the AUTHELIA_*_FILE variables in docker-compose.yml.
# APP_DOMAIN is injected with the `template` config filter.

theme: auto

server:
  address: 'tcp://:9091/authelia'

log:
  level: info

totp:
  issuer: Weekender

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml
    watch: false
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    - domain: '{{ env "APP_DOMAIN" }}'
      policy: one_factor

session:
  name: weekender_session
  expiration: 8h
  inactivity: 1h
  cookies:
    - domain: '{{ env "APP_DOMAIN" }}'
      authelia_url: 'https://{{ env "APP_DOMAIN" }}/authelia'
      default_redirection_url: 'https://{{ env "APP_DOMAIN" }}/settings'

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 10m

storage:
  local:
    path: /var/lib/authelia/db.sqlite3

notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
