# Weekly dependency updates. Each update is a pull request that runs the full
# CI suite (unit, build, browser and accessibility tests) before it can merge;
# merging to main deploys automatically.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
