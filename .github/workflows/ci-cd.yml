name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/weekender-app

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: backend
        env:
          DATA_DIR: ${{ runner.temp }}/data

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  image:
    name: Image, browser & accessibility tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Validate compose file and Caddyfile (both TLS modes)
        run: |
          cp .env.example .env && docker compose config --quiet
          for mode in internal acme; do
            docker run --rm -e APP_DOMAIN=example.com -e TLS_MODE=$mode \
              -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8.4-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: weekender-app:ci
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the app
        run: |
          docker run -d --name app -p 8000:8000 -e ADMIN_AUTH_DISABLED=1 -e PREWARM_CITIES= weekender-app:ci
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors http://localhost:8000/api/health

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Browser + axe accessibility tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8000
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: App logs
        if: failure()
        run: docker logs app | tail -100

      - name: Push image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag weekender-app:ci "$IMAGE:${{ github.sha }}"
          docker tag weekender-app:ci "$IMAGE:latest"
          docker push --quiet "$IMAGE:${{ github.sha }}"
          docker push --quiet "$IMAGE:latest"

  deploy:
    name: Deploy to production
    needs: [backend, frontend, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server-side key is a forced command: it can only run scripts/deploy.sh.
      # The commit SHA selects exactly what CI tested; the short-lived job token
      # (on stdin, never on the command line) lets the server pull the tested image.
      - name: Deploy ${{ github.sha }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "${{ github.sha }}"

      - uses: actions/checkout@v5
        with:
          sparse-checkout: Caddyfile
          sparse-checkout-cone-mode: false

      - name: Smoke test
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://${{ vars.APP_DOMAIN }}/api/health"
          # The live security policy must match the Caddyfile we just deployed (catches config drift).
          expected=$(grep -oP 'Content-Security-Policy "\K[^"]+' Caddyfile)
          live=$(curl -sSI "https://${{ vars.APP_DOMAIN }}/" | tr -d '\r' | sed -n 's/^content-security-policy: //Ip')
          [ "$expected" = "$live" ] || { echo "Live CSP does not match the Caddyfile"; echo "expected: $expected"; echo "live:     $live"; exit 1; }
          curl -fsS -o /dev/null "https://${{ vars.APP_DOMAIN }}/"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.APP_DOMAIN }}/api/admin/settings")
          [ "$code" = 401 ] || [ "$code" = 302 ] || { echo "Settings API is not protected (HTTP $code)"; exit 1; }
          echo "Healthy, and Settings is still behind Authelia."

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  lighthouse:
    name: Lighthouse (live site)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit home and a city page
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://${{ vars.APP_DOMAIN }}/
            https://${{ vars.APP_DOMAIN }}/?city=2988507
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
